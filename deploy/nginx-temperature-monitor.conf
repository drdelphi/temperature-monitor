# Temperature monitor — nginx reverse proxy (Cloudflare → origin).
# Upstream ports are localhost-only; see deploy/docker-compose.prod.yml.
# Install as /etc/nginx/sites-available/temperature-monitor.conf.

map $http_upgrade $connection_upgrade_tempmon {
    default upgrade;
    '' close;
}

upstream tempmon_web {
    server 127.0.0.1:3030;
}

upstream tempmon_api {
    server 127.0.0.1:4030;
}

# --- HTTP: ACME + redirect ---
server {
    listen 80;
    listen [::]:80;
    server_name temperatura.live api.temperatura.live;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS web ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name temperatura.live;

    ssl_certificate /etc/letsencrypt/live/temperatura.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/temperatura.live/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://tempmon_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_tempmon;
        proxy_read_timeout 60s;
    }
}

# --- HTTPS API ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.temperatura.live;

    ssl_certificate /etc/letsencrypt/live/temperatura.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/temperatura.live/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Probes flush backlogged flash rings in large batches.
    client_max_body_size 25m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://tempmon_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_tempmon;
        # /v1/stream is a long-lived WebSocket for live sample fan-out.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
